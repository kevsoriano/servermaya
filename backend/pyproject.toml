[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.133",
    "google-adk>=2.12",
    "google-auth>=2.61.0",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-storage>=3.17.0",
    "google-genai>=2.29.0",
    "pillow>=12.3.0",
    "pypdf[crypto]>=6.20.1",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
