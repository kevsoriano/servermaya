[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.133",
    "google-adk>=2.12",
    "google-auth>=2.61.0",
    "google-cloud-agentplatform>=2.0.1",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-storage>=3.17.0",
    "google-genai>=2.29.0",
    "pillow>=12.3.0",
    "pypdf[crypto]>=6.20.1",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 150
target-version = "py313"

[tool.ruff.lint.isort]
known-first-party = ["core", "domain", "evals", "helpers", "integrations", "routes", "seed", "services"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = [
    "B008",    # FastAPI declares dependencies as Depends(...) defaults
    "B904",    # an HTTPException is the response; the original error is not for the client
    "B905",    # zip() lengths match by construction; strict=True would turn a data surprise into a crash
    "C408",    # dict(...) reads better for the eval's case tables
    "E501",    # the formatter wraps code; long strings and comments stay readable
    "E731",    # small named lambdas are the house style
    "SIM105",  # try/except/pass is clearer than contextlib.suppress here
]
